appId: com.emreh.app
productName: Emreh
artifactName: Emreh-Setup-${version}.${ext}
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - public/**/*
  - package.json
asar: true
win:
  target:
    - nsis
  icon: public/pwa-192x192.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Emreh
